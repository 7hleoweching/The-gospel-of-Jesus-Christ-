<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loving Correction</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0605;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  .canvas {
    width: 700px;
    height: 700px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  /* Deep warm background */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 80% at 50% 40%, #2a0c0a 0%, #100302 55%, #000000 100%);
  }

  /* Warm glow */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 50% 38%, rgba(200,100,30,0.22) 0%, transparent 70%),
      radial-gradient(ellipse 30% 20% at 50% 15%, rgba(255,200,80,0.10) 0%, transparent 60%);
    animation: breathe 5s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { opacity: 0.7; }
    to   { opacity: 1; }
  }

  /* Ornamental frame */
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(196,152,60,0.35);
    border-radius: 2px;
  }
  .frame::before {
    content: '';
    position: absolute;
    inset: 7px;
    border: 1px solid rgba(196,152,60,0.15);
    border-radius: 1px;
  }

  /* Corner ornaments */
  .corner {
    position: absolute;
    width: 38px;
    height: 38px;
    opacity: 0.75;
  }
  .corner svg { width: 100%; height: 100%; }
  .c-tl { top: 22px; left: 22px; }
  .c-tr { top: 22px; right: 22px; transform: scaleX(-1); }
  .c-bl { bottom: 22px; left: 22px; transform: scaleY(-1); }
  .c-br { bottom: 22px; right: 22px; transform: scale(-1,-1); }

  /* Content */
  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 60px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Cross icon */
  .cross-wrap {
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.3s;
  }
  .cross-wrap svg {
    width: 38px;
    height: 38px;
    filter: drop-shadow(0 0 14px rgba(220,160,50,0.6));
  }

  /* Eyebrow */
  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 9.5px;
    letter-spacing: 5px;
    color: rgba(200,155,60,0.7);
    text-transform: uppercase;
    margin-bottom: 26px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.55s;
  }

  /* Main quote */
  .quote-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 100px;
    line-height: 0.3;
    color: rgba(200,140,40,0.45);
    font-weight: 300;
    display: block;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.7s;
  }

  .quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    line-height: 1.55;
    font-weight: 300;
    color: #f5e8cb;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.9s;
  }

  .quote em {
    font-style: italic;
    color: #f0d99a;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 30px 0 26px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.1s;
  }
  .divider-line {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(196,152,60,0.55));
  }
  .divider-line.right {
    background: linear-gradient(to left, transparent, rgba(196,152,60,0.55));
  }
  .divider-dot {
    width: 5px;
    height: 5px;
    border: 1px solid rgba(196,152,60,0.7);
    transform: rotate(45deg);
    background: rgba(196,152,60,0.15);
  }

  /* Scripture ref */
  .scripture {
    font-family: 'Cinzel', serif;
    font-size: 10.5px;
    letter-spacing: 3.5px;
    color: rgba(196,152,60,0.6);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.3s;
  }

  /* Sub text */
  .sub {
    margin-top: 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13.5px;
    font-style: italic;
    color: rgba(200,155,100,0.45);
    letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.5s;
  }

  /* Floating particles */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .p {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(220,170,60,0.55);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 0.6; }
    100% { transform: translateY(-280px) scale(0.3); opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="bg"></div>
  <div class="glow"></div>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <!-- Frame -->
  <div class="frame"></div>

  <!-- Corner ornaments -->
  <div class="corner c-tl">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 36 L2 4 Q2 2 4 2 L36 2" stroke="rgba(196,152,60,0.65)" stroke-width="1"/>
      <path d="M2 20 Q10 14 14 2" stroke="rgba(196,152,60,0.35)" stroke-width="0.8" fill="none"/>
      <circle cx="2" cy="2" r="2" fill="rgba(196,152,60,0.5)"/>
      <rect x="10" y="10" width="4" height="4" transform="rotate(45 12 12)" fill="none" stroke="rgba(196,152,60,0.4)" stroke-width="0.8"/>
    </svg>
  </div>
  <div class="corner c-tr">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 36 L2 4 Q2 2 4 2 L36 2" stroke="rgba(196,152,60,0.65)" stroke-width="1"/>
      <path d="M2 20 Q10 14 14 2" stroke="rgba(196,152,60,0.35)" stroke-width="0.8" fill="none"/>
      <circle cx="2" cy="2" r="2" fill="rgba(196,152,60,0.5)"/>
      <rect x="10" y="10" width="4" height="4" transform="rotate(45 12 12)" fill="none" stroke="rgba(196,152,60,0.4)" stroke-width="0.8"/>
    </svg>
  </div>
  <div class="corner c-bl">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 36 L2 4 Q2 2 4 2 L36 2" stroke="rgba(196,152,60,0.65)" stroke-width="1"/>
      <path d="M2 20 Q10 14 14 2" stroke="rgba(196,152,60,0.35)" stroke-width="0.8" fill="none"/>
      <circle cx="2" cy="2" r="2" fill="rgba(196,152,60,0.5)"/>
      <rect x="10" y="10" width="4" height="4" transform="rotate(45 12 12)" fill="none" stroke="rgba(196,152,60,0.4)" stroke-width="0.8"/>
    </svg>
  </div>
  <div class="corner c-br">
    <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 36 L2 4 Q2 2 4 2 L36 2" stroke="rgba(196,152,60,0.65)" stroke-width="1"/>
      <path d="M2 20 Q10 14 14 2" stroke="rgba(196,152,60,0.35)" stroke-width="0.8" fill="none"/>
      <circle cx="2" cy="2" r="2" fill="rgba(196,152,60,0.5)"/>
      <rect x="10" y="10" width="4" height="4" transform="rotate(45 12 12)" fill="none" stroke="rgba(196,152,60,0.4)" stroke-width="0.8"/>
    </svg>
  </div>

  <!-- Main Content -->
  <div class="content">

    <div class="cross-wrap">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="19" y1="3" x2="19" y2="35" stroke="rgba(220,170,55,0.85)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="5" y1="14" x2="33" y2="14" stroke="rgba(220,170,55,0.85)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="19" cy="19" r="17" stroke="rgba(196,152,60,0.25)" stroke-width="0.8"/>
        <circle cx="19" cy="19" r="13" stroke="rgba(196,152,60,0.1)" stroke-width="0.5"/>
      </svg>
    </div>

    <div class="eyebrow">A Truth of Love</div>

    <span class="quote-mark">"</span>

    <p class="quote">
      Loving correction is true love.<br>
      <em>If you love someone,</em><br>
      you will correct them —<br>
      for whom the Lord loves,<br>
      <em>He disciplines.</em>
    </p>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line right"></div>
    </div>

    <div class="scripture">Hebrews 12 : 6</div>
    <div class="sub">For the Lord disciplines the one He loves</div>
  </div>
</div>

<script>
  // Generate floating particles
  const container = document.getElementById('particles');
  const count = 22;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    const size = Math.random() * 2.5 + 1;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${40 + Math.random() * 55}%;
      width: ${size}px;
      height: ${size}px;
      animation-duration: ${5 + Math.random() * 7}s;
      animation-delay: ${Math.random() * 6}s;
      opacity: 0;
    `;
    container.appendChild(p);
  }
</script>
</body>
</html>
